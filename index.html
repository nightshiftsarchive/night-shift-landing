<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIGHT SHIFT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #030303;
      color: #eeeae2;
      overflow: hidden;
      font-family: Georgia, "Times New Roman", serif;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255,255,255,.018),
          transparent 42%
        ),
        #030303;
    }


    /* =====================================================
       EUROPE — GHOST MAP
    ===================================================== */

    .map-stage {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: min(760px, 48vw);
      aspect-ratio: 450 / 456;

      z-index: 1;

      pointer-events: none;
    }


    /* actual map */

    .map-stage::before {
      content: "";

      position: absolute;
      inset: 0;

      background-image:
        url("./Blank_map_of_Europe_1839.svg");

      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;

      opacity: .15;

      filter:
        grayscale(1)
        invert(1)
        brightness(.72)
        contrast(3);

      z-index: 1;
    }


    /* fades the land mass without hiding the borders */

    .map-stage::after {
      content: "";

      position: absolute;
      inset: 0;

      z-index: 2;

      background:
        radial-gradient(
          ellipse at center,
          rgba(3,3,3,.14) 0%,
          rgba(3,3,3,.22) 48%,
          rgba(3,3,3,.6) 92%
        );
    }


    /* =====================================================
       CITY SIGNALS
    ===================================================== */

    .city {
      position: absolute;

      width: 2px;
      height: 2px;

      border-radius: 50%;

      background: #eeeae2;

      z-index: 5;
    }


    .city.soft {
      opacity: .16;

      box-shadow:
        0 0 3px rgba(255,255,255,.2);
    }


    .city.main {
      width: 3px;
      height: 3px;

      opacity: 1;

      box-shadow:
        0 0 4px rgba(255,255,255,1),
        0 0 9px rgba(255,255,255,.75),
        0 0 22px rgba(255,255,255,.35);

      animation:
        cityPulse
        4.2s
        ease-in-out
        infinite;
    }


    .city.main::after {
      content: "";

      position: absolute;

      left: 50%;
      top: 50%;

      width: 16px;
      height: 16px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      border:
        1px solid rgba(255,255,255,.10);
    }


    @keyframes cityPulse {
      0%,
      100% {
        transform: scale(.7);
        opacity: .3;
      }

      50% {
        transform: scale(1.35);
        opacity: 1;
      }
    }


    /* approximate locations on the actual SVG */

    .madrid {
      left: 31%;
      top: 68%;
      animation-delay: 0s;
    }

    .amsterdam {
      left: 45%;
      top: 43%;
      animation-delay: 1.35s;
    }

    .berlin {
      left: 53%;
      top: 42%;
      animation-delay: 2.7s;
    }

    .london {
      left: 39%;
      top: 43%;
    }

    .paris {
      left: 41%;
      top: 50%;
    }

    .lisbon {
      left: 25%;
      top: 69%;
    }

    .rome {
      left: 51%;
      top: 65%;
    }

    .vienna {
      left: 57%;
      top: 55%;
    }

    .prague {
      left: 54%;
      top: 49%;
    }

    .warsaw {
      left: 60%;
      top: 46%;
    }

    .copenhagen {
      left: 51%;
      top: 35%;
    }

    .oslo {
      left: 48%;
      top: 22%;
    }

    .stockholm {
      left: 55%;
      top: 23%;
    }

    .budapest {
      left: 59%;
      top: 57%;
    }

    .bucharest {
      left: 66%;
      top: 61%;
    }

    .athens {
      left: 63%;
      top: 73%;
    }


    /* =====================================================
       CORNERS
    ===================================================== */

    .corner {
      position: absolute;
      z-index: 20;

      text-transform: uppercase;

      color: rgba(238,234,226,.66);
    }


    .top-left {
      top: 27px;
      left: 30px;
    }


    .brand {
      font-size: 11px;
      letter-spacing: 5px;
    }


    .hours {
      margin-top: 6px;

      font-size: 6px;

      letter-spacing: 3px;

      opacity: .62;
    }


    .top-right {
      top: 30px;
      right: 30px;

      font-size: 7px;

      letter-spacing: 3px;
    }


    .bottom-left {
      bottom: 22px;
      left: 30px;

      font-size: 6px;

      letter-spacing: 2px;

      opacity: .5;
    }


    .bottom-right {
      bottom: 22px;
      right: 30px;

      font-size: 6px;

      letter-spacing: 2px;

      opacity: .5;
    }


    /* =====================================================
       CENTRAL CONTENT
    ===================================================== */

    .content {
      position: absolute;

      left: 50%;
      top: 48%;

      transform: translate(-50%, -50%);

      width: min(700px, 72vw);

      text-align: center;

      z-index: 10;
    }


    .clock {
      margin-bottom: 19px;

      font-size: 7px;

      letter-spacing: 4px;

      color: rgba(238,234,226,.52);
    }


    h1 {
      white-space: nowrap;

      font-size:
        clamp(
          25px,
          2.65vw,
          42px
        );

      font-weight: 400;

      letter-spacing: .08em;

      line-height: 1;

      color: #eeeae2;
    }


    .question {
      margin-top: 18px;

      font-size: 7px;

      letter-spacing: 4px;

      color: rgba(238,234,226,.64);
    }


    /* =====================================================
       FORM
    ===================================================== */

    .form-area {
      width: min(390px, 74vw);

      margin: 32px auto 0;
    }


    .form {
      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 22px;
    }


    .field {
      text-align: left;
    }


    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 6px;

      letter-spacing: 3px;

      color: rgba(238,234,226,.46);
    }


    .field input {
      width: 100%;

      border: none;

      border-bottom:
        1px solid
        rgba(238,234,226,.38);

      outline: none;

      background: transparent;

      padding:
        0
        2px
        7px;

      color: #eeeae2;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 8px;

      letter-spacing: 1px;
    }


    .field input:focus {
      border-bottom-color:
        rgba(238,234,226,.9);
    }


    button {
      width: 100%;

      height: 36px;

      margin-top: 21px;

      border:
        1px solid
        rgba(238,234,226,.34);

      background:
        rgba(3,3,3,.48);

      color: #eeeae2;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 6px;

      letter-spacing: 3px;

      cursor: pointer;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
    }


    button:hover {
      background: #eeeae2;
      color: #030303;
      border-color: #eeeae2;
    }


    .status {
      min-height: 13px;

      margin-top: 11px;

      font-size: 6px;

      letter-spacing: 2px;

      color: rgba(238,234,226,.48);
    }


    /* =====================================================
       TEXTURE
    ===================================================== */

    .scanlines {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 40;

      opacity: .015;

      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.45) 0,
          rgba(255,255,255,.45) 1px,
          transparent 1px,
          transparent 4px
        );
    }


    .vignette {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 7;

      background:
        radial-gradient(
          ellipse at center,
          transparent 48%,
          rgba(0,0,0,.12) 73%,
          rgba(0,0,0,.46) 100%
        );
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      body {
        overflow-y: auto;
      }


      .landing {
        height: auto;
        min-height: 100vh;

        padding:
          145px
          20px
          100px;
      }


      .map-stage {
        width: 110vw;

        top: 47%;

        opacity: .8;
      }


      .content {
        position: relative;

        left: auto;
        top: auto;

        transform: none;

        width: 100%;
      }


      h1 {
        white-space: normal;

        font-size:
          clamp(
            29px,
            9vw,
            39px
          );

        line-height: 1.08;
      }


      .question {
        font-size: 7px;

        letter-spacing: 3px;

        line-height: 1.7;
      }


      .form-area {
        width: 100%;

        max-width: 350px;

        margin-top: 38px;
      }


      .form {
        grid-template-columns: 1fr;

        gap: 23px;
      }


      .top-left {
        left: 20px;
        top: 21px;
      }


      .top-right {
        right: 20px;
        top: 23px;

        max-width: 130px;

        text-align: right;

        line-height: 1.4;
      }


      .bottom-left {
        left: 20px;
        bottom: 18px;
      }


      .bottom-right {
        display: none;
      }

    }

  </style>
</head>


<body>

<main class="landing">


  <div class="corner top-left">

    <div class="brand">
      NIGHT SHIFT
    </div>

    <div class="hours">
      22:00 — 06:00
    </div>

  </div>


  <div class="corner top-right">
    NOT ANOTHER SOCIAL APP.
  </div>



  <!-- EUROPE -->

  <div class="map-stage">

    <span class="city main madrid"></span>
    <span class="city main amsterdam"></span>
    <span class="city main berlin"></span>

    <span class="city soft london"></span>
    <span class="city soft paris"></span>
    <span class="city soft lisbon"></span>
    <span class="city soft rome"></span>
    <span class="city soft vienna"></span>
    <span class="city soft prague"></span>
    <span class="city soft warsaw"></span>
    <span class="city soft copenhagen"></span>
    <span class="city soft oslo"></span>
    <span class="city soft stockholm"></span>
    <span class="city soft budapest"></span>
    <span class="city soft bucharest"></span>
    <span class="city soft athens"></span>

  </div>



  <!-- CENTER -->

  <section class="content">

    <div class="clock">

      EUROPE /
      <span id="clock">
        --:--
      </span>

    </div>


    <h1>
      YOUR CITY IS ASLEEP.
    </h1>


    <div class="question">
      DO YOU WANT TO START YOUR NIGHT SHIFT?
    </div>



    <div class="form-area">

      <form
        id="accessForm"
        class="form"
      >

        <div class="field">

          <label for="email">
            EMAIL
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            required
          >

        </div>


        <div class="field">

          <label for="city">
            CITY
          </label>

          <input
            id="city"
            type="text"
            autocomplete="address-level2"
            required
          >

        </div>

      </form>


      <button
        type="submit"
        form="accessForm"
      >

        REQUEST ACCESS TO SHIFT →

      </button>


      <div
        id="status"
        class="status"
      ></div>

    </div>

  </section>



  <div class="corner bottom-left">
    DOCUMENTING WHAT HAPPENS AFTER DARK.
  </div>


  <div class="corner bottom-right">
    ARCHIVE NIGHT SHIFT — ALL RIGHTS RESERVED.
  </div>


  <div class="vignette"></div>

  <div class="scanlines"></div>


</main>



<script>

  function updateClock() {

    const now =
      new Date();


    const hours =
      String(
        now.getHours()
      ).padStart(
        2,
        "0"
      );


    const minutes =
      String(
        now.getMinutes()
      ).padStart(
        2,
        "0"
      );


    document
      .getElementById("clock")
      .textContent =
      `${hours}:${minutes}`;

  }


  updateClock();


  setInterval(
    updateClock,
    1000
  );



  const form =
    document.getElementById(
      "accessForm"
    );


  const status =
    document.getElementById(
      "status"
    );


  form.addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const city =
        document
          .getElementById("city")
          .value
          .trim();


      if (!email || !city) {
        return;
      }


      status.textContent =
        "REQUEST RECEIVED. WE'LL WAKE YOU WHEN YOUR CITY DOES.";


      form.reset();

    }
  );

</script>


</body>
</html>
