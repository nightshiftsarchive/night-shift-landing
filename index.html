<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIGHT SHIFT — Archive the Night</title>

  <style>

    /* =========================================================
       RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #050505;
      color: #eeeae2;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }


    /* =========================================================
       MAIN SCREEN
    ========================================================= */

    .landing {
      position: relative;

      width: 100vw;
      height: 100vh;

      min-height: 650px;

      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,0.025),
          transparent 48%
        ),
        #050505;
    }


    /* =========================================================
       MAP
    ========================================================= */

    .europe-map {
      position: absolute;

      left: 50%;
      top: 52%;

      transform: translate(-50%, -50%);

      width: 82vw;
      max-width: 1450px;

      opacity: 0.42;

      z-index: 0;
    }


    .map-land {
      fill: rgba(255,255,255,0.008);

      stroke: rgba(238,234,226,0.15);
      stroke-width: 0.9;

      vector-effect: non-scaling-stroke;
    }


    /* =========================================================
       CITY LIGHTS
    ========================================================= */

    .city-light {
      fill: #eeeae2;

      opacity: 0.22;

      filter:
        drop-shadow(0 0 2px rgba(255,255,255,.25));
    }


    .city-light.medium {
      opacity: 0.38;

      filter:
        drop-shadow(0 0 4px rgba(255,255,255,.35));
    }


    .city-light.main {
      opacity: 0.95;

      filter:
        drop-shadow(0 0 4px rgba(255,255,255,.9))
        drop-shadow(0 0 12px rgba(255,255,255,.55))
        drop-shadow(0 0 25px rgba(255,255,255,.25));

      animation: cityPulse 3.5s ease-in-out infinite;
    }


    .amsterdam {
      animation-delay: 0s;
    }

    .berlin {
      animation-delay: 1.1s;
    }

    .madrid {
      animation-delay: 2.2s;
    }


    @keyframes cityPulse {

      0%,
      100% {
        opacity: .45;
        r: 3;
      }

      50% {
        opacity: 1;
        r: 5;
      }

    }


    /* =========================================================
       CITY LABELS
    ========================================================= */

    .city-label {
      font-family: Georgia, serif;

      fill: rgba(238,234,226,.64);

      font-size: 12px;

      letter-spacing: 4px;
    }


    /* =========================================================
       CORNERS
    ========================================================= */

    .corner {
      position: absolute;

      z-index: 10;

      font-size: 11px;

      letter-spacing: 4px;

      text-transform: uppercase;

      line-height: 1.7;

      color: rgba(238,234,226,.82);
    }


    .top-left {
      top: 35px;
      left: 42px;
    }


    .top-left strong {
      display: block;

      font-weight: normal;

      font-size: 14px;

      letter-spacing: 6px;
    }


    .top-left span {
      display: block;

      margin-top: 3px;

      font-size: 9px;

      letter-spacing: 4px;

      opacity: .72;
    }


    .top-right {
      top: 42px;
      right: 42px;

      font-size: 10px;
    }


    .bottom-left {
      bottom: 30px;
      left: 42px;

      font-size: 9px;

      letter-spacing: 3px;

      opacity: .66;
    }


    .bottom-right {
      bottom: 30px;
      right: 42px;

      font-size: 9px;

      letter-spacing: 3px;

      opacity: .66;
    }


    /* =========================================================
       CENTRAL CONTENT
    ========================================================= */

    .content {
      position: absolute;

      left: 50%;
      top: 47%;

      transform: translate(-50%, -50%);

      width: min(1100px, 88vw);

      text-align: center;

      z-index: 5;
    }


    /* =========================================================
       CLOCK
    ========================================================= */

    .clock {
      margin-bottom: 38px;

      font-size: 11px;

      letter-spacing: 5px;

      color: rgba(238,234,226,.62);
    }


    /* =========================================================
       HEADLINE
    ========================================================= */

    h1 {
      white-space: nowrap;

      font-weight: 400;

      font-size: clamp(42px, 5.4vw, 90px);

      letter-spacing: .04em;

      line-height: 1;

      color: #eeeae2;

      text-shadow:
        0 0 20px rgba(255,255,255,.04);
    }


    .question {
      margin-top: 30px;

      font-size: 12px;

      letter-spacing: 6px;

      color: rgba(238,234,226,.78);

      text-transform: uppercase;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .form-wrapper {
      width: min(660px, 90vw);

      margin: 70px auto 0;
    }


    .access-form {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 26px;
    }


    .field {
      position: relative;
    }


    .field label {
      display: block;

      text-align: left;

      margin-bottom: 12px;

      font-size: 9px;

      letter-spacing: 4px;

      color: rgba(238,234,226,.58);
    }


    .field input {
      width: 100%;

      border: none;

      border-bottom: 1px solid rgba(238,234,226,.55);

      background: transparent;

      padding: 0 4px 12px;

      outline: none;

      color: #eeeae2;

      font-family: Georgia, serif;

      font-size: 13px;

      letter-spacing: 2px;

      transition: border-color .25s ease;
    }


    .field input:focus {
      border-bottom-color: #eeeae2;
    }


    .access-button {
      width: 100%;

      height: 58px;

      margin-top: 38px;

      border: 1px solid rgba(238,234,226,.55);

      background: rgba(0,0,0,.25);

      color: #eeeae2;

      font-family: Georgia, serif;

      font-size: 10px;

      letter-spacing: 5px;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .3s ease,
        color .3s ease,
        border-color .3s ease;
    }


    .access-button:hover {
      background: #eeeae2;

      color: #080808;

      border-color: #eeeae2;
    }


    .status {
      min-height: 20px;

      margin-top: 17px;

      font-size: 9px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color: rgba(238,234,226,.6);
    }


    /* =========================================================
       SCREEN TEXTURE
    ========================================================= */

    .scanlines {
      position: absolute;

      inset: 0;

      z-index: 20;

      pointer-events: none;

      opacity: .035;

      background-image:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.55) 0,
          rgba(255,255,255,.55) 1px,
          transparent 1px,
          transparent 4px
        );
    }


    .vignette {
      position: absolute;

      inset: 0;

      z-index: 4;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0,0,0,.2) 72%,
          rgba(0,0,0,.65) 100%
        );
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media(max-width: 800px) {

      body {
        overflow-y: auto;
      }


      .landing {
        min-height: 100vh;
        height: auto;

        padding: 170px 25px 120px;
      }


      .content {
        position: relative;

        left: auto;
        top: auto;

        transform: none;

        width: 100%;
      }


      h1 {
        white-space: normal;

        font-size: clamp(46px, 13vw, 70px);

        line-height: 1.05;
      }


      .clock {
        margin-bottom: 28px;
      }


      .question {
        font-size: 10px;

        letter-spacing: 4px;

        line-height: 1.8;

        margin-top: 24px;
      }


      .form-wrapper {
        margin-top: 58px;
      }


      .access-form {
        grid-template-columns: 1fr;

        gap: 32px;
      }


      .europe-map {
        width: 160vw;

        top: 48%;

        opacity: .28;
      }


      .top-left {
        left: 22px;
        top: 24px;
      }


      .top-right {
        right: 22px;
        top: 27px;

        font-size: 8px;

        max-width: 150px;

        text-align: right;
      }


      .bottom-left {
        left: 22px;
        bottom: 20px;

        font-size: 7px;
      }


      .bottom-right {
        display: none;
      }

    }

  </style>

</head>

      </h1>

          id="accessForm"
        >

              id="email"
              autocomplete="email"
              required
            >

          <div class="field">

              CITY
            </label>

              type="text"
              id="city"
              autocomplete="address-level2"
              required
            >

          class="access-button"
          type="submit"
          form="accessForm"

          REQUEST ACCESS TO SHIFT →

          id="status"

  <script>

    /* =========================================================
       LIVE CLOCK
    ========================================================= */

    function updateClock() {

      const now = new Date();


      const hours =
        String(now.getHours()).padStart(2, "0");


      const minutes =
        String(now.getMinutes()).padStart(2, "0");


      document.getElementById("currentTime").textContent =
        `${hours}:${minutes}`;

    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );



    /* =========================================================
       TEMPORARY ACCESS FORM
    ========================================================= */

    const form =
      document.getElementById("accessForm");


    const status =
      document.getElementById("status");


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const email =
          document.getElementById("email").value.trim();


        const city =
          document.getElementById("city").value.trim();


        if (!email || !city) {

          return;

        }


        status.textContent =
          "REQUEST RECEIVED. WE'LL WAKE YOU WHEN YOUR CITY DOES.";


        form.reset();

      }
    );

  </script>
