<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIGHT SHIFT</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: #eeeae2;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 620px;
      overflow: hidden;
      background:
        radial-gradient(
          ellipse at 50% 50%,
          rgba(255,255,255,0.025),
          transparent 44%
        ),
        #050505;
    }

    /* ======================================================
       REAL EUROPE MAP
    ====================================================== */

    .map-wrap {
      position: absolute;
      left: 50%;
      top: 51%;
      transform: translate(-50%, -50%);
      width: min(980px, 64vw);
      aspect-ratio: 972 / 673;
      z-index: 1;
      pointer-events: none;
    }

    .real-map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;

      opacity: 0.36;

      filter:
        grayscale(1)
        invert(1)
        brightness(1.55)
        contrast(1.45);

      mix-blend-mode: screen;
    }

    .map-dim {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          ellipse at center,
          transparent 28%,
          rgba(5,5,5,.18) 70%,
          rgba(5,5,5,.5) 100%
        );
      z-index: 2;
    }

    /* ======================================================
       CITY SIGNALS
    ====================================================== */

    .city {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #eeeae2;
      z-index: 4;
    }

    .city.soft {
      opacity: .28;
      box-shadow:
        0 0 4px rgba(255,255,255,.18);
    }

    .city.main {
      opacity: 1;
      box-shadow:
        0 0 4px rgba(255,255,255,.95),
        0 0 10px rgba(255,255,255,.62),
        0 0 24px rgba(255,255,255,.3);

      animation: pulse 3.6s ease-in-out infinite;
    }

    .city.main::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.14);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(.75);
        opacity: .35;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* Approximate geographic positions on the real Europe map */

    .madrid {
      left: 31.5%;
      top: 68.5%;
      animation-delay: 0s;
    }

    .amsterdam {
      left: 45.3%;
      top: 43.5%;
      animation-delay: 1.2s;
    }

    .berlin {
      left: 53.5%;
      top: 42.5%;
      animation-delay: 2.4s;
    }

    .london {
      left: 39.6%;
      top: 42.8%;
    }

    .paris {
      left: 41.2%;
      top: 50.4%;
    }

    .lisbon {
      left: 25.7%;
      top: 69.5%;
    }

    .rome {
      left: 51.1%;
      top: 65.3%;
    }

    .vienna {
      left: 57.1%;
      top: 54.6%;
    }

    .prague {
      left: 54.7%;
      top: 49.6%;
    }

    .warsaw {
      left: 60.2%;
      top: 46.4%;
    }

    .copenhagen {
      left: 51.2%;
      top: 35.5%;
    }

    .oslo {
      left: 48.3%;
      top: 22.5%;
    }

    .stockholm {
      left: 55.2%;
      top: 23.2%;
    }

    .budapest {
      left: 59.1%;
      top: 57.3%;
    }

    .bucharest {
      left: 66.5%;
      top: 61.1%;
    }

    .athens {
      left: 63.3%;
      top: 73%;
    }

    /* ======================================================
       CORNERS
    ====================================================== */

    .corner {
      position: absolute;
      z-index: 20;
      text-transform: uppercase;
      color: rgba(238,234,226,.72);
    }

    .top-left {
      top: 28px;
      left: 34px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 5px;
    }

    .hours {
      margin-top: 6px;
      font-size: 7px;
      letter-spacing: 3px;
      opacity: .66;
    }

    .top-right {
      top: 32px;
      right: 34px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 8px;
      letter-spacing: 3px;
    }

    .bottom-left {
      bottom: 24px;
      left: 34px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 7px;
      letter-spacing: 2px;
      opacity: .56;
    }

    .bottom-right {
      bottom: 24px;
      right: 34px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 7px;
      letter-spacing: 2px;
      opacity: .56;
    }

    /* ======================================================
       CENTRAL CONTENT
    ====================================================== */

    .center {
      position: absolute;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      width: min(720px, 74vw);
      text-align: center;
      z-index: 10;
    }

    .clock {
      margin-bottom: 20px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 8px;
      letter-spacing: 4px;
      color: rgba(238,234,226,.58);
    }

    h1 {
      white-space: nowrap;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 2.8vw, 44px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: .08em;
      color: #eeeae2;
    }

    .question {
      margin-top: 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 8px;
      letter-spacing: 4px;
      line-height: 1.7;
      color: rgba(238,234,226,.68);
    }

    /* ======================================================
       FORM
    ====================================================== */

    .form-area {
      width: min(420px, 76vw);
      margin: 34px auto 0;
    }

    .form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }

    .field {
      text-align: left;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 7px;
      letter-spacing: 3px;
      color: rgba(238,234,226,.5);
    }

    .field input {
      width: 100%;
      border: none;
      border-bottom: 1px solid rgba(238,234,226,.44);
      outline: none;
      background: transparent;
      padding: 0 2px 7px;
      color: #eeeae2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 9px;
      letter-spacing: 1px;
    }

    .field input:focus {
      border-bottom-color: rgba(238,234,226,.95);
    }

    button {
      width: 100%;
      height: 38px;
      margin-top: 22px;
      border: 1px solid rgba(238,234,226,.42);
      background: rgba(0,0,0,.3);
      color: #eeeae2;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 7px;
      letter-spacing: 3px;
      cursor: pointer;
      transition:
        background .25s ease,
        color .25s ease;
    }

    button:hover {
      background: #eeeae2;
      color: #050505;
    }

    .status {
      min-height: 14px;
      margin-top: 12px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 7px;
      letter-spacing: 2px;
      color: rgba(238,234,226,.52);
    }

    /* ======================================================
       TEXTURE
    ====================================================== */

    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      opacity: .02;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.45) 0,
          rgba(255,255,255,.45) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 8;
      background:
        radial-gradient(
          ellipse at center,
          transparent 42%,
          rgba(0,0,0,.12) 68%,
          rgba(0,0,0,.52) 100%
        );
    }

    /* ======================================================
       MOBILE
    ====================================================== */

    @media (max-width: 700px) {

      body {
        overflow-y: auto;
      }

      .landing {
        height: auto;
        min-height: 100vh;
        padding: 145px 20px 100px;
      }

      .map-wrap {
        width: 145vw;
        top: 49%;
      }

      .center {
        position: relative;
        left: auto;
        top: auto;
        transform: none;
        width: 100%;
      }

      h1 {
        white-space: normal;
        font-size: clamp(30px, 9vw, 40px);
        line-height: 1.08;
      }

      .question {
        font-size: 8px;
        letter-spacing: 3px;
      }

      .form-area {
        width: 100%;
        max-width: 370px;
        margin-top: 40px;
      }

      .form {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .top-left {
        left: 20px;
        top: 22px;
      }

      .top-right {
        right: 20px;
        top: 24px;
        max-width: 140px;
        text-align: right;
        line-height: 1.4;
      }

      .bottom-left {
        left: 20px;
        bottom: 18px;
      }

      .bottom-right {
        display: none;
      }
    }
  </style>

</head>

<body>

  <main class="landing">

    <div class="corner top-left">
      <div class="brand">NIGHT SHIFT</div>
      <div class="hours">22:00 — 06:00</div>
    </div>

    <div class="corner top-right">
      NOT ANOTHER SOCIAL APP.
    </div>


    <!-- REAL MAP -->

    <div class="map-wrap">

      <img
        class="real-map"
        src="https://upload.wikimedia.org/wikipedia/commons/b/bf/Europe_blank_map.svg"
        alt=""
      >

      <div class="map-dim"></div>

      <!-- MAIN SIGNALS -->

      <span class="city main madrid"></span>
      <span class="city main amsterdam"></span>
      <span class="city main berlin"></span>

      <!-- SOFTER CAPITALS -->

      <span class="city soft london"></span>
      <span class="city soft paris"></span>
      <span class="city soft lisbon"></span>
      <span class="city soft rome"></span>
      <span class="city soft vienna"></span>
      <span class="city soft prague"></span>
      <span class="city soft warsaw"></span>
      <span class="city soft copenhagen"></span>
      <span class="city soft oslo"></span>
      <span class="city soft stockholm"></span>
      <span class="city soft budapest"></span>
      <span class="city soft bucharest"></span>
      <span class="city soft athens"></span>

    </div>


    <!-- CONTENT -->

    <section class="center">

      <div class="clock">
        EUROPE / <span id="clock">--:--</span>
      </div>

      <h1>
        YOUR CITY IS ASLEEP.
      </h1>

      <div class="question">
        DO YOU WANT TO START YOUR NIGHT SHIFT?
      </div>

      <div class="form-area">

        <form id="accessForm" class="form">

          <div class="field">
            <label for="email">EMAIL</label>
            <input
              type="email"
              id="email"
              autocomplete="email"
              required
            >
          </div>

          <div class="field">
            <label for="city">CITY</label>
            <input
              type="text"
              id="city"
              autocomplete="address-level2"
              required
            >
          </div>

        </form>

        <button type="submit" form="accessForm">
          REQUEST ACCESS TO SHIFT →
        </button>

        <div id="status" class="status"></div>

      </div>

    </section>


    <div class="corner bottom-left">
      DOCUMENTING WHAT HAPPENS AFTER DARK.
    </div>

    <div class="corner bottom-right">
      ARCHIVE NIGHT SHIFT — ALL RIGHTS RESERVED.
    </div>


    <div class="vignette"></div>
    <div class="scanlines"></div>

  </main>


  <script>

    /* LIVE CLOCK */

    function updateClock() {

      const now = new Date();

      const hours =
        String(now.getHours()).padStart(2, "0");

      const minutes =
        String(now.getMinutes()).padStart(2, "0");

      document
        .getElementById("clock")
        .textContent =
        `${hours}:${minutes}`;

    }

    updateClock();

    setInterval(updateClock, 1000);


    /* TEMPORARY FORM */

    const form =
      document.getElementById("accessForm");

    const status =
      document.getElementById("status");

    form.addEventListener("submit", function(event) {

      event.preventDefault();

      const email =
        document.getElementById("email").value.trim();

      const city =
        document.getElementById("city").value.trim();

      if (!email || !city) {
        return;
      }

      status.textContent =
        "REQUEST RECEIVED. WE'LL WAKE YOU WHEN YOUR CITY DOES.";

      form.reset();

    });

  </script>

</body>

</html>
