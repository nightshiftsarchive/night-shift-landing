<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NIGHT SHIFT — Archive the Night</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #030303;
      color: #f1f1ed;
      font-family: "Courier New", Courier, monospace;
    }

    body {
      overflow: hidden;
    }

    .landing {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.025),
          transparent 35%
        ),
        #030303;
      isolation: isolate;
    }

    /* MAP BACKGROUND */

    .map {
      position: absolute;
      width: min(1000px, 88vw);
      height: auto;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0.38;
      z-index: -2;
    }

    .continent {
      fill: rgba(255,255,255,0.013);
      stroke: rgba(255,255,255,0.09);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .city {
      fill: #e8e8df;
      opacity: 0.25;
    }

    .city.active {
      opacity: 0.95;
      filter:
        drop-shadow(0 0 4px rgba(255,255,255,0.85))
        drop-shadow(0 0 10px rgba(255,255,255,0.45));
      animation: pulse 3.2s infinite ease-in-out;
    }

    .city.delay-1 { animation-delay: .7s; }
    .city.delay-2 { animation-delay: 1.3s; }
    .city.delay-3 { animation-delay: 2s; }
    .city.delay-4 { animation-delay: 2.6s; }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.35;
        r: 2.2;
      }

      50% {
        opacity: 1;
        r: 3.2;
      }
    }

    /* OVERLAY */

    .noise {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      opacity: 0.035;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.4) 0px,
          rgba(255,255,255,0.4) 1px,
          transparent 1px,
          transparent 3px
        );
    }

    /* CONTENT */

    .content {
      width: min(720px, 88vw);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .micro {
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.42);
      margin-bottom: 34px;
    }

    h1 {
      font-size: clamp(38px, 5.2vw, 76px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -0.05em;
      margin-bottom: 28px;
    }

    .question {
      font-size: clamp(12px, 1.25vw, 16px);
      letter-spacing: 0.15em;
      line-height: 1.6;
      text-transform: uppercase;
      color: rgba(255,255,255,0.63);
      margin-bottom: 43px;
    }

    /* FORM */

    .access-form {
      width: min(570px, 100%);
      display: grid;
      grid-template-columns: 1fr 0.72fr;
      border-top: 1px solid rgba(255,255,255,0.22);
      border-bottom: 1px solid rgba(255,255,255,0.22);
    }

    .field {
      position: relative;
      border-right: 1px solid rgba(255,255,255,0.22);
    }

    .field:last-of-type {
      border-right: none;
    }

    input {
      width: 100%;
      height: 62px;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f1ed;
      padding: 0 18px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    input::placeholder {
      color: rgba(255,255,255,0.35);
    }

    input:focus {
      background: rgba(255,255,255,0.025);
    }

    button {
      margin-top: 15px;
      width: min(570px, 100%);
      height: 57px;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      color: #f1f1ed;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
    }

    button:hover {
      background: #f1f1ed;
      color: #050505;
      border-color: #f1f1ed;
    }

    .status {
      height: 20px;
      margin-top: 18px;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    /* BRAND */

    .brand {
      position: absolute;
      left: 28px;
      top: 24px;
      font-size: 11px;
      letter-spacing: 0.25em;
      z-index: 3;
    }

    .counter {
      position: absolute;
      right: 28px;
      top: 24px;
      font-size: 9px;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.38);
      z-index: 3;
    }

    .footer {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 24px;
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      z-index: 3;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .landing {
        padding: 100px 22px 80px;
      }

      .content {
        width: 100%;
      }

      .micro {
        margin-bottom: 26px;
      }

      h1 {
        font-size: clamp(42px, 14vw, 64px);
      }

      .question {
        width: 90%;
        margin-bottom: 38px;
      }

      .access-form {
        grid-template-columns: 1fr;
      }

      .field {
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.22);
      }

      .field:last-of-type {
        border-bottom: none;
      }

      .brand {
        left: 18px;
        top: 20px;
      }

      .counter {
        right: 18px;
        top: 20px;
      }

      .footer {
        left: 18px;
        right: 18px;
        bottom: 18px;
      }

      .footer span:last-child {
        display: none;
      }

      .map {
        width: 150vw;
        opacity: 0.3;
      }
    }
  </style>
</head>

<body>

  <main class="landing">

    <div class="brand">NIGHT SHIFT</div>

    <div class="counter">
      ARCHIVE / 000001
    </div>

    <!-- Abstract Europe map -->
    <svg class="map" viewBox="0 0 1000 650" aria-hidden="true">

      <path
        class="continent"
        d="
          M130 155
          L180 120
          L245 130
          L280 100
          L325 125
          L370 118
          L405 145
          L455 135
          L500 165
          L545 150
          L590 175
          L635 172
          L675 205
          L730 195
          L770 230
          L810 250
          L790 290
          L820 320
          L780 345
          L745 330
          L720 360
          L675 370
          L640 405
          L600 410
          L575 450
          L530 435
          L500 470
          L455 460
          L415 420
          L375 410
          L345 375
          L300 355
          L270 320
          L225 305
          L200 265
          L155 245
          Z
        "
      />

      <!-- city signals -->

      <circle class="city active" cx="310" cy="365" r="2.5" />
      <circle class="city active delay-1" cx="392" cy="305" r="2.5" />
      <circle class="city active delay-2" cx="470" cy="270" r="2.5" />
      <circle class="city active delay-3" cx="525" cy="318" r="2.5" />
      <circle class="city active delay-4" cx="585" cy="260" r="2.5" />

      <circle class="city" cx="355" cy="250" r="2" />
      <circle class="city" cx="430" cy="225" r="2" />
      <circle class="city" cx="555" cy="210" r="2" />
      <circle class="city" cx="620" cy="335" r="2" />
      <circle class="city" cx="680" cy="285" r="2" />

    </svg>

    <section class="content">

      <div class="micro">
        Europe / 02:13
      </div>

      <h1>
        YOUR CITY<br>
        IS ASLEEP.
      </h1>

      <p class="question">
        DO YOU WANT TO START YOUR NIGHT SHIFT?
      </p>

      <form class="access-form" id="accessForm">

        <div class="field">
          <input
            type="email"
            id="email"
            placeholder="EMAIL"
            required
          />
        </div>

        <div class="field">
          <input
            type="text"
            id="city"
            placeholder="CITY"
            required
          />
        </div>

      </form>

      <button type="submit" form="accessForm">
        REQUEST ACCESS TO SHIFT →
      </button>

      <div class="status" id="status"></div>

    </section>

    <div class="footer">
      <span>THE NIGHT IS BEING ARCHIVED.</span>
      <span>ARCHIVENIGHTSHIFT.COM</span>
    </div>

    <div class="noise"></div>

  </main>

  <script>
    const form = document.getElementById("accessForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value;
      const city = document.getElementById("city").value;

      if (email && city) {
        status.textContent =
          "REQUEST RECEIVED. WE'LL WAKE YOU WHEN YOUR CITY DOES.";

        form.reset();
      }
    });
  </script>

</body>
</html>
