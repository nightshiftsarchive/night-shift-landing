<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NIGHT SHIFT — Archive the Night</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #050505;
      color: #eeeae2;
      font-family: Georgia, "Times New Roman", serif;
      overflow: hidden;
    }

    .landing {
      position: relative;
      width: 100vw;
      height: 100vh;
      min-height: 650px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,0.025),
          transparent 46%
        ),
        #050505;
    }

    /* MAP */

    .europe-map {
      position: absolute;
      left: 50%;
      top: 51%;

      transform: translate(-50%, -50%);

      width: 72vw;
      max-width: 1180px;

      opacity: 0.75;

      z-index: 0;
    }

    .map-land {
      fill: rgba(255,255,255,0.012);
      stroke: rgba(238,234,226,0.28);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    /* CITY LIGHTS */

    .city-light {
      fill: #eeeae2;

      opacity: 0.20;

      filter:
        drop-shadow(0 0 2px rgba(255,255,255,.22));
    }

    .city-light.medium {
      opacity: 0.35;

      filter:
        drop-shadow(0 0 4px rgba(255,255,255,.3));
    }

    .city-light.main {
      opacity: 0.95;

      filter:
        drop-shadow(0 0 4px rgba(255,255,255,.95))
        drop-shadow(0 0 11px rgba(255,255,255,.5))
        drop-shadow(0 0 22px rgba(255,255,255,.22));

      animation: cityPulse 3.8s ease-in-out infinite;
    }

    .amsterdam {
      animation-delay: 0s;
    }

    .berlin {
      animation-delay: 1.2s;
    }

    .madrid {
      animation-delay: 2.4s;
    }

    @keyframes cityPulse {

      0%,
      100% {
        opacity: .42;
        r: 3;
      }

      50% {
        opacity: 1;
        r: 4.5;
      }

    }

    .city-label {
      font-family: Georgia, serif;
      fill: rgba(238,234,226,.55);
      font-size: 11px;
      letter-spacing: 3px;
    }

    /* CORNERS */

    .corner {
      position: absolute;

      z-index: 10;

      text-transform: uppercase;

      color: rgba(238,234,226,.8);
    }

    .top-left {
      top: 32px;
      left: 40px;
    }

    .top-left strong {
      display: block;

      font-weight: normal;

      font-size: 13px;

      letter-spacing: 6px;
    }

    .top-left span {
      display: block;

      margin-top: 5px;

      font-size: 8px;

      letter-spacing: 4px;

      opacity: .7;
    }

    .top-right {
      top: 38px;
      right: 40px;

      font-size: 9px;

      letter-spacing: 4px;
    }

    .bottom-left {
      bottom: 28px;
      left: 40px;

      font-size: 8px;

      letter-spacing: 3px;

      opacity: .62;
    }

    .bottom-right {
      bottom: 28px;
      right: 40px;

      font-size: 8px;

      letter-spacing: 3px;

      opacity: .62;
    }

    /* CENTRAL CONTENT */

    .content {
      position: absolute;

      left: 50%;
      top: 48%;

      transform: translate(-50%, -50%);

      width: min(920px, 84vw);

      text-align: center;

      z-index: 5;
    }

    .clock {
      margin-bottom: 30px;

      font-size: 9px;

      letter-spacing: 5px;

      color: rgba(238,234,226,.58);
    }

    h1 {
      white-space: nowrap;

      font-weight: 400;

      font-size: clamp(34px, 4vw, 64px);

      letter-spacing: .06em;

      line-height: 1;

      color: #eeeae2;

      text-shadow:
        0 0 15px rgba(255,255,255,.04);
    }

    .question {
      margin-top: 22px;

      font-size: 10px;

      letter-spacing: 5px;

      color: rgba(238,234,226,.72);

      text-transform: uppercase;
    }

    /* FORM */

    .form-wrapper {
      width: min(560px, 86vw);

      margin: 46px auto 0;
    }

    .access-form {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 28px;
    }

    .field {
      position: relative;
    }

    .field label {
      display: block;

      text-align: left;

      margin-bottom: 9px;

      font-size: 8px;

      letter-spacing: 4px;

      color: rgba(238,234,226,.54);
    }

    .field input {
      width: 100%;

      border: none;

      border-bottom: 1px solid rgba(238,234,226,.45);

      background: transparent;

      padding: 0 3px 9px;

      outline: none;

      color: #eeeae2;

      font-family: Georgia, serif;

      font-size: 11px;

      letter-spacing: 2px;

      transition: border-color .25s ease;
    }

    .field input:focus {
      border-bottom-color: #eeeae2;
    }

    .access-button {
      width: 100%;

      height: 48px;

      margin-top: 28px;

      border: 1px solid rgba(238,234,226,.45);

      background: rgba(0,0,0,.22);

      color: #eeeae2;

      font-family: Georgia, serif;

      font-size: 9px;

      letter-spacing: 4px;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .3s ease,
        color .3s ease,
        border-color .3s ease;
    }

    .access-button:hover {
      background: #eeeae2;

      color: #080808;

      border-color: #eeeae2;
    }

    .status {
      min-height: 18px;

      margin-top: 15px;

      font-size: 8px;

      letter-spacing: 3px;

      text-transform: uppercase;

      color: rgba(238,234,226,.56);
    }

    /* TEXTURE */

    .scanlines {
      position: absolute;

      inset: 0;

      z-index: 20;

      pointer-events: none;

      opacity: .025;

      background-image:
        repeating-linear-gradient(
          to bottom,
          rgba(255,255,255,.5) 0,
          rgba(255,255,255,.5) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .vignette {
      position: absolute;

      inset: 0;

      z-index: 4;

      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          transparent 43%,
          rgba(0,0,0,.18) 73%,
          rgba(0,0,0,.62) 100%
        );
    }

    /* MOBILE */

    @media(max-width: 800px) {

      body {
        overflow-y: auto;
      }

      .landing {
        min-height: 100vh;
        height: auto;

        padding: 150px 24px 110px;
      }

      .content {
        position: relative;

        left: auto;
        top: auto;

        transform: none;

        width: 100%;
      }

      h1 {
        white-space: normal;

        font-size: clamp(36px, 10vw, 54px);

        line-height: 1.05;
      }

      .clock {
        margin-bottom: 24px;
      }

      .question {
        font-size: 9px;

        letter-spacing: 4px;

        line-height: 1.7;

        margin-top: 20px;
      }

      .form-wrapper {
        margin-top: 46px;
      }

      .access-form {
        grid-template-columns: 1fr;

        gap: 28px;
      }

      .europe-map {
        width: 150vw;

        top: 48%;

        opacity: .5;
      }

      .top-left {
        left: 20px;
        top: 22px;
      }

      .top-right {
        right: 20px;
        top: 25px;

        font-size: 7px;

        max-width: 150px;

        text-align: right;
      }

      .bottom-left {
        left: 20px;
        bottom: 18px;

        font-size: 7px;
      }

      .bottom-right {
        display: none;
      }

    }

  </style>

</head>

            </label>

              type="email"
              id="email"
              autocomplete="email"

            >

          <div class="field">

            <label for="city">
              CITY
            </label>

              type="text"
              id="city"
              autocomplete="address-level2"
              required

          class="access-button"
          type="submit"

  <script>

    function updateClock() {

      const now = new Date();


      const hours =
        String(now.getHours()).padStart(2, "0");


      const minutes =
        String(now.getMinutes()).padStart(2, "0");


      document.getElementById("currentTime").textContent =
        `${hours}:${minutes}`;

    }


    updateClock();


    setInterval(
      updateClock,
      1000
    );



    const form =
      document.getElementById("accessForm");


    const status =
      document.getElementById("status");


    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        const email =
          document.getElementById("email").value.trim();


        const city =
          document.getElementById("city").value.trim();


        if (!email || !city) {
          return;
        }


        status.textContent =
          "REQUEST RECEIVED. WE'LL WAKE YOU WHEN YOUR CITY DOES.";


        form.reset();

      }
    );

  </script>
