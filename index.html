<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGHT SHIFT</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: #050505;
  color: #eeeae2;
  overflow: hidden;

  font-family:
    "Courier New",
    Courier,
    monospace;
}


/* =========================================================
   PAGE
========================================================= */

.landing {

  position: relative;

  width: 100vw;
  height: 100vh;

  min-height: 620px;

  overflow: hidden;

  background:
    radial-gradient(
      ellipse at 50% 48%,
      rgba(255,255,255,.025),
      transparent 42%
    ),
    #050505;

}


/* =========================================================
   FAINT MAP
========================================================= */

.map {

  position: absolute;

  width: min(900px, 62vw);

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

  z-index: 0;

  opacity: .32;

}


.map path {

  fill: rgba(255,255,255,.005);

  stroke:
    rgba(238,234,226,.23);

  stroke-width: .7;

  vector-effect:
    non-scaling-stroke;

}


/* =========================================================
   CITY SIGNALS
========================================================= */

.signal {

  fill: #f2eee6;

  opacity: .2;

}


.signal.secondary {

  opacity: .18;

}


.signal.main {

  opacity: 1;

  filter:

    drop-shadow(
      0 0 3px
      rgba(255,255,255,.9)
    )

    drop-shadow(
      0 0 9px
      rgba(255,255,255,.5)
    )

    drop-shadow(
      0 0 18px
      rgba(255,255,255,.2)
    );

  animation:
    signalPulse
    4s
    ease-in-out
    infinite;

}


.madrid {
  animation-delay: 0s;
}

.amsterdam {
  animation-delay: 1.3s;
}

.berlin {
  animation-delay: 2.6s;
}


@keyframes signalPulse {

  0%,
  100% {

    opacity: .35;
    r: 2;

  }

  50% {

    opacity: 1;
    r: 4;

  }

}


/* =========================================================
   CORNERS
========================================================= */

.corner {

  position: absolute;

  z-index: 20;

  text-transform: uppercase;

  color:
    rgba(238,234,226,.7);

}


.top-left {

  top: 30px;
  left: 34px;

}


.brand {

  font-size: 11px;

  letter-spacing: 5px;

}


.shift-hours {

  margin-top: 6px;

  font-size: 7px;

  letter-spacing: 3px;

  opacity: .62;

}


.top-right {

  top: 34px;
  right: 34px;

  font-size: 7px;

  letter-spacing: 3px;

}


.bottom-left {

  bottom: 25px;
  left: 34px;

  font-size: 7px;

  letter-spacing: 2px;

  opacity: .52;

}


.bottom-right {

  bottom: 25px;
  right: 34px;

  font-size: 7px;

  letter-spacing: 2px;

  opacity: .52;

}


/* =========================================================
   CENTRAL BLOCK
========================================================= */

.center {

  position: absolute;

  left: 50%;
  top: 48%;

  transform:
    translate(-50%, -50%);

  width: min(760px, 78vw);

  text-align: center;

  z-index: 10;

}


/* =========================================================
   CLOCK
========================================================= */

.clock {

  margin-bottom: 23px;

  font-size: 8px;

  letter-spacing: 4px;

  color:
    rgba(238,234,226,.55);

}


/* =========================================================
   HEADLINE
========================================================= */

h1 {

  white-space: nowrap;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:
    clamp(
      28px,
      3vw,
      46px
    );

  font-weight: 400;

  letter-spacing: .07em;

  line-height: 1;

  color: #eeeae2;

}


/* =========================================================
   QUESTION
========================================================= */

.question {

  margin-top: 18px;

  font-size: 8px;

  letter-spacing: 4px;

  line-height: 1.8;

  color:
    rgba(238,234,226,.62);

}


/* =========================================================
   FORM
========================================================= */

.form-area {

  width:
    min(
      430px,
      80vw
    );

  margin:
    38px
    auto
    0;

}


.form {

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 24px;

}


.field {

  text-align: left;

}


.field label {

  display: block;

  margin-bottom: 8px;

  font-size: 7px;

  letter-spacing: 3px;

  color:
    rgba(238,234,226,.5);

}


.field input {

  width: 100%;

  padding:
    0
    2px
    8px;

  border: none;

  border-bottom:
    1px solid
    rgba(238,234,226,.38);

  outline: none;

  background: transparent;

  color: #eeeae2;

  font-family:
    "Courier New",
    monospace;

  font-size: 9px;

  letter-spacing: 1px;

}


.field input:focus {

  border-bottom-color:
    rgba(238,234,226,.9);

}


/* =========================================================
   BUTTON
========================================================= */

button {

  width: 100%;

  height: 39px;

  margin-top: 23px;

  border:
    1px solid
    rgba(238,234,226,.35);

  background:
    rgba(0,0,0,.18);

  color: #eeeae2;

  font-family:
    "Courier New",
    monospace;

  font-size: 7px;

  letter-spacing: 3px;

  cursor: pointer;

  transition:
    background .25s ease,
    color .25s ease,
    border-color .25s ease;

}


button:hover {

  background:
    #eeeae2;

  color:
    #050505;

  border-color:
    #eeeae2;

}


/* =========================================================
   STATUS
========================================================= */

.status {

  margin-top: 13px;

  min-height: 14px;

  font-size: 7px;

  letter-spacing: 2px;

  color:
    rgba(238,234,226,.52);

}


/* =========================================================
   TEXTURE
========================================================= */

.scanlines {

  position: fixed;

  inset: 0;

  pointer-events: none;

  z-index: 50;

  opacity: .022;

  background-image:

    repeating-linear-gradient(

      to bottom,

      rgba(255,255,255,.4) 0,

      rgba(255,255,255,.4) 1px,

      transparent 1px,

      transparent 4px

    );

}


.vignette {

  position: absolute;

  inset: 0;

  pointer-events: none;

  z-index: 5;

  background:

    radial-gradient(

      ellipse at center,

      transparent 45%,

      rgba(0,0,0,.18) 73%,

      rgba(0,0,0,.68) 100%

    );

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

  body {

    overflow-y: auto;

  }


  .landing {

    min-height: 100vh;

    height: auto;

    padding:

      145px
      22px
      100px;

  }


  .center {

    position: relative;

    left: auto;
    top: auto;

    transform: none;

    width: 100%;

  }


  h1 {

    white-space: normal;

    font-size:
      clamp(
        31px,
        10vw,
        42px
      );

    line-height: 1.08;

  }


  .question {

    margin-top: 20px;

    font-size: 8px;

    letter-spacing: 3px;

  }


  .form-area {

    width: 100%;

    max-width: 390px;

    margin-top: 43px;

  }


  .form {

    grid-template-columns:
      1fr;

    gap: 25px;

  }


  .map {

    width: 150vw;

    opacity: .22;

  }


  .top-left {

    left: 20px;
    top: 22px;

  }


  .top-right {

    right: 20px;
    top: 25px;

    max-width: 130px;

    text-align: right;

    line-height: 1.5;

  }


  .bottom-left {

    left: 20px;
    bottom: 18px;

  }


  .bottom-right {

    display: none;

  }

}

</style>
</head>

<script>

/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

  const now =
    new Date();


  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  document
    .getElementById(
      "clock"
    )
    .textContent =
      `${hours}:${minutes}`;

}


updateClock();


setInterval(
  updateClock,
  1000
);



/* =========================================================
   FORM
========================================================= */

const form =
  document.getElementById(
    "accessForm"
  );


const status =
  document.getElementById(
    "status"
  );


form.addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    const email =
      document
        .getElementById(
          "email"
        )
        .value
        .trim();


    const city =
      document
        .getElementById(
          "city"
        )
        .value
        .trim();


    if (
      !email ||
      !city
    ) {

      return;

    }


    status.textContent =
      "REQUEST RECEIVED. WE'LL WAKE YOU WHEN YOUR CITY DOES.";


    form.reset();

  }
);

</script>
