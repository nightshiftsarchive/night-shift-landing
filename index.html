<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIGHT SHIFT</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #030303;
    color: #eeeae2;
    overflow: hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}


/* =========================================================
   LANDING
========================================================= */

.landing {

    position: relative;

    width: 100vw;
    height: 100vh;

    min-height: 620px;

    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 47%,
            rgba(255,255,255,.018),
            transparent 43%
        ),
        #030303;
}


/* =========================================================
   EUROPE OVERLAY
========================================================= */

.europe-overlay {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    width: min(780px, 52vw);

    height: auto;

    z-index: 1;

    pointer-events: none;

    overflow: visible;
}


/* ALL MAP LINES */

.country {

    fill: none;

    stroke:
        rgba(238,234,226,.18);

    stroke-width: 1;

    vector-effect:
        non-scaling-stroke;

    stroke-linejoin: round;

    stroke-linecap: round;
}


/* exterior coastlines slightly stronger */

.coast {

    fill: none;

    stroke:
        rgba(238,234,226,.27);

    stroke-width: 1.1;

    vector-effect:
        non-scaling-stroke;

    stroke-linejoin: round;

    stroke-linecap: round;
}


/* =========================================================
   CITY SIGNALS
========================================================= */

.city-core {

    fill: #f4f0e8;

}


.city-glow {

    fill: rgba(244,240,232,.22);

    transform-box: fill-box;

    transform-origin: center;

    animation:
        cityPulse
        4s
        ease-in-out
        infinite;
}


.city-ring {

    fill: none;

    stroke:
        rgba(244,240,232,.15);

    stroke-width: 1;

    transform-box: fill-box;

    transform-origin: center;

    animation:
        ringPulse
        4s
        ease-out
        infinite;
}


.amsterdam-glow,
.amsterdam-ring {
    animation-delay: 1.3s;
}


.berlin-glow,
.berlin-ring {
    animation-delay: 2.6s;
}


@keyframes cityPulse {

    0%,
    100% {
        opacity: .25;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.8);
    }

}


@keyframes ringPulse {

    0% {
        opacity: .45;
        transform: scale(.4);
    }

    65% {
        opacity: .08;
    }

    100% {
        opacity: 0;
        transform: scale(2.2);
    }

}


/* =========================================================
   CORNER TEXT
========================================================= */

.corner {

    position: absolute;

    z-index: 20;

    text-transform: uppercase;

    color:
        rgba(238,234,226,.68);
}


.top-left {

    top: 28px;
    left: 32px;

}


.brand {

    font-size: 11px;

    letter-spacing: 5px;

}


.hours {

    margin-top: 6px;

    font-size: 6px;

    letter-spacing: 3px;

    opacity: .6;
}


.top-right {

    top: 31px;
    right: 32px;

    font-size: 7px;

    letter-spacing: 3px;
}


.bottom-left {

    bottom: 23px;
    left: 32px;

    font-size: 6px;

    letter-spacing: 2px;

    opacity: .48;
}


.bottom-right {

    bottom: 23px;
    right: 32px;

    font-size: 6px;

    letter-spacing: 2px;

    opacity: .48;
}


/* =========================================================
   CENTRAL CONTENT
========================================================= */

.content {

    position: absolute;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%);

    width:
        min(680px, 72vw);

    text-align: center;

    z-index: 10;
}


/* CLOCK */

.clock {

    margin-bottom: 20px;

    font-size: 7px;

    letter-spacing: 4px;

    color:
        rgba(238,234,226,.52);
}


/* HEADLINE */

h1 {

    white-space: nowrap;

    font-size:
        clamp(
            25px,
            2.65vw,
            42px
        );

    font-weight: 400;

    letter-spacing: .08em;

    line-height: 1;

    color: #eeeae2;
}


/* QUESTION */

.question {

    margin-top: 18px;

    font-size: 7px;

    letter-spacing: 4px;

    color:
        rgba(238,234,226,.64);
}


/* =========================================================
   FORM
========================================================= */

.form-area {

    width:
        min(
            390px,
            74vw
        );

    margin:
        32px
        auto
        0;
}


.form {

    display: grid;

    grid-template-columns:
        1fr
        1fr;

    gap: 22px;
}


.field {

    text-align: left;
}


.field label {

    display: block;

    margin-bottom: 7px;

    font-size: 6px;

    letter-spacing: 3px;

    color:
        rgba(238,234,226,.46);
}


.field input {

    width: 100%;

    border: none;

    border-bottom:
        1px solid
        rgba(238,234,226,.38);

    outline: none;

    background: transparent;

    padding:
        0
        2px
        7px;

    color: #eeeae2;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 9px;

    letter-spacing: 1px;
}


.field input:focus {

    border-bottom-color:
        rgba(238,234,226,.9);
}


/* =========================================================
   BUTTON
========================================================= */

button {

    width: 100%;

    height: 36px;

    margin-top: 21px;

    border:
        1px solid
        rgba(238,234,226,.34);

    background:
        rgba(3,3,3,.72);

    color: #eeeae2;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 6px;

    letter-spacing: 3px;

    cursor: pointer;

    transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
}


button:hover {

    background: #eeeae2;

    color: #030303;

    border-color: #eeeae2;
}


/* =========================================================
   FORM STATUS
========================================================= */

.status {

    min-height: 13px;

    margin-top: 11px;

    font-size: 6px;

    letter-spacing: 2px;

    color:
        rgba(238,234,226,.48);
}


/* =========================================================
   PAGE TEXTURE
========================================================= */

.vignette {

    position: absolute;

    inset: 0;

    z-index: 7;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,.08) 72%,
            rgba(0,0,0,.42) 100%
        );
}


.scanlines {

    position: absolute;

    inset: 0;

    z-index: 40;

    pointer-events: none;

    opacity: .014;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.45) 0,
            rgba(255,255,255,.45) 1px,
            transparent 1px,
            transparent 4px
        );
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    body {

    }

            95px;

    .europe-overlay {

        opacity: .72;

    }


    .content {

        position: relative;

        left: auto;
        top: auto;

        transform: none;

        width: 100%;

    }


    .clock {

        margin-bottom: 18px;

    }


    h1 {

        white-space: normal;

        max-width: 360px;

        margin: 0 auto;

        font-size:
            clamp(
                29px,
                9vw,
                39px
            );

        line-height: 1.08;

    }


    .question {

        max-width: 300px;

        margin:
            18px
            auto
            0;

        letter-spacing: 3px;

        line-height: 1.7;

    }


    .form-area {

        width: 100%;

    }


    .form {

    }


    button {

        margin-top: 25px;

    }


    .top-left {

        left: 20px;
        top: 21px;

    }


    .top-right {

        right: 20px;
        top: 23px;

        max-width: 135px;

        text-align: right;

        line-height: 1.5;

    }


    .bottom-left {

        left: 20px;
        bottom: 18px;

        max-width: 220px;

        line-height: 1.5;

    }


    .bottom-right {

        display: none;

    }

}

</style>

<script>

/* =========================================================
   LIVE CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    const hours =
        String(
            now.getHours()
        ).padStart(
            2,
            "0"
        );


    const minutes =
        String(
            now.getMinutes()
        ).padStart(
            2,
            "0"
        );


    document
        .getElementById("clock")
        .textContent =
        `${hours}:${minutes}`;

}


updateClock();


setInterval(
    updateClock,
    1000
);



/* =========================================================
   TEMP FORM BEHAVIOUR
   REAL DATABASE CONNECTION COMES NEXT
========================================================= */

const form =
    document.getElementById(
        "accessForm"
    );


const status =
    document.getElementById(
        "status"
    );


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const city =
            document
                .getElementById("city")
                .value
                .trim();


        if (!email || !city) {
            return;
        }


        status.textContent =
            "REQUEST RECEIVED. SHIFT PENDING.";


        form.reset();

    }
);

</script>
